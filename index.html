<style>
:root{--navy:#1F3864;--blue:#2E5496;--accent:#4472C4;--sky:#8FAADC;--bg:#EEF2F9;--ink:#1B2430;--muted:#6B7688;--green:#2E9E5B;--amber:#E8A13A;--red:#DB4A4A;--line:#E4EAF3;--pc:#2E5496;--pc2:#1F3864}
*{box-sizing:border-box;margin:0;padding:0}
i[data-lucide],i[data-icon]{display:inline-flex;flex-shrink:0;width:16px;height:16px}
i[data-icon] svg.ic{width:100%;height:100%;display:block}
body{font-family:'Prompt','Tahoma',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:22px 14px 40px}
.wrap{max-width:1040px;margin:0 auto}
#tt{position:fixed;z-index:200;background:#1F3864;color:#fff;font-size:12px;font-weight:500;padding:6px 11px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap;box-shadow:0 4px 14px rgba(31,56,100,.3)}

/* ===== masthead + tabs ===== */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:0 4px}
.mast .t{font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:9px}
.mast .t i{width:19px;height:19px;color:var(--accent)}
.mast .m{font-size:12.5px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:6px;position:sticky;top:10px;z-index:60;box-shadow:0 6px 22px rgba(31,56,100,.08);overflow-x:auto}
.tab{flex:1;min-width:118px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:10px 12px;border-radius:11px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;position:relative}
.tab i{width:15px;height:15px}
.tab:hover{background:#F4F7FC;color:var(--navy)}
.tab.on{background:var(--tc,#2E5496);color:#fff;box-shadow:0 4px 12px rgba(31,56,100,.2)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0}
.tab.on .dot{background:#FFD27F}
.tab.rdy .dot{background:var(--green)}
.tab.on.rdy .dot{background:#8BEEB4}
.pane{display:none;animation:fade .25s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== hero ===== */
.hero{background:radial-gradient(120% 140% at 15% 0%,var(--pc) 0%,var(--pc2) 55%,#101E38 100%);color:#fff;padding:30px 32px 28px;border-radius:22px;position:relative;overflow:hidden;margin-top:16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero .ey{font-size:12.5px;letter-spacing:.4px;opacity:.9;font-weight:500;display:flex;align-items:center;gap:8px}
.hero .ey i{width:15px;height:15px}
.hero h1{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:.2px;position:relative}
.hero .desc{font-size:13px;opacity:.88;margin-top:5px;max-width:620px;position:relative}
.herostats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:22px;position:relative}
.hs{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;backdrop-filter:blur(2px)}
.hs.roas{background:rgba(46,158,91,.18);border-color:rgba(126,224,168,.4)}
.hs.roas .v{color:#7EE6A9;font-size:26px}
.hs .l{font-size:11.5px;opacity:.85;line-height:1.35}
.hs .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.hs .v.na{opacity:.4;font-weight:600}
.hs.roas .v.na{color:#fff}

/* ===== sections ===== */
section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:16px;box-shadow:0 6px 22px rgba(31,56,100,.06)}
.sh{font-size:17px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;margin-bottom:3px}
.sh i{width:19px;height:19px;color:var(--pc)}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 13px 29px}
.divhead{margin-top:24px;padding-top:16px;border-top:1px dashed var(--line)}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:2px}
svg{width:100%;height:auto;display:block}

/* ===== empty state ===== */
.empty{border:2px dashed #C9D6EA;border-radius:15px;background:linear-gradient(180deg,#FBFCFF,#F4F7FC);padding:22px 24px;text-align:center}
.empty .ei{width:42px;height:42px;border-radius:13px;background:#E7EEFA;display:inline-flex;align-items:center;justify-content:center;margin-bottom:9px}
.empty .ei i{width:21px;height:21px;color:var(--accent)}
.empty .et{font-size:14px;font-weight:700;color:var(--navy)}
.empty .ed{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:600px;margin-left:auto;margin-right:auto;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{font-size:11px;font-weight:600;color:#3D5680;background:#fff;border:1px solid #D5E0F0;border-radius:20px;padding:4px 11px;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}
.banner{background:#FDF6E3;border:1px solid #F0DCA8;border-left:4px solid var(--amber);border-radius:13px;padding:14px 18px;font-size:13px;color:#7A5F12;margin-top:16px;display:flex;gap:12px;align-items:flex-start}
.banner i{width:19px;height:19px;flex-shrink:0;margin-top:2px;color:#B4791C}
.banner b{color:#5E4708}
.banner code{background:#fff;border:1px solid #EBD9A6;border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:#8A6D1F}

/* ===== weekly ===== */
.wtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.wt{border:1.5px solid var(--line);border-radius:13px;padding:11px 10px;text-align:center;cursor:pointer;transition:.15s;background:#fff;position:relative}
.wt:hover{border-color:var(--sky)}
.wt.on{border-color:var(--pc);background:#F4F7FC;box-shadow:0 4px 12px rgba(68,114,196,.14)}
.wt.na{cursor:default;opacity:.6;border-style:dashed}
.wt .wn{font-size:13.5px;font-weight:700;color:var(--navy)}
.wt .wr{font-size:10.5px;color:var(--muted);margin-top:1px}
.wt .wv{font-size:20px;font-weight:800;color:var(--pc);margin-top:6px}
.wt .wl{font-size:10px;color:var(--muted)}
.wt .crown{position:absolute;top:-9px;right:-7px;background:var(--amber);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px}
.wpanel{background:#F4F7FC;border:1px solid var(--line);border-radius:13px;padding:14px 17px;font-size:13.5px}
.wpanel b{color:var(--navy)}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:11px}
.wg{text-align:center}
.wg .l{font-size:11px;color:var(--muted)}
.wg .v{font-size:19px;font-weight:700;color:var(--navy);margin-top:2px}

/* ===== bars / toggle ===== */
.toggle{display:inline-flex;background:#EEF2F9;border-radius:10px;padding:3px;gap:2px;margin-bottom:13px}
.toggle button{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.toggle button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(31,56,100,.12)}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.pbar .pn{width:140px;font-size:13px;font-weight:600;color:var(--navy);flex-shrink:0}
.pbar .track{flex:1;background:#EEF2F9;border-radius:8px;height:30px;display:flex;align-items:center}
.pbar .fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;min-width:66px;overflow:hidden}
.cumstat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.cumstat .c{background:#F4F7FC;border:1px solid var(--line);border-radius:11px;padding:11px 14px;text-align:center}
.cumstat .c .l{font-size:11px;color:var(--muted)}
.cumstat .c .v{font-size:19px;font-weight:800;color:var(--navy);margin-top:2px}
.cumstat .c.good .v{color:var(--green)}

/* ===== funnel ===== */
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch}
.fstep{position:relative;background:#F4F7FC;border:1px solid var(--line);padding:15px 16px;text-align:center}
.fstep:first-child{border-radius:13px 0 0 13px}
.fstep:last-child{border-radius:0 13px 13px 0}
.fstep+.fstep{border-left:none}
.fstep .fl{font-size:11.5px;color:var(--muted)}
.fstep .fv{font-size:23px;font-weight:800;color:var(--pc);margin-top:3px;font-variant-numeric:tabular-nums}
.fstep .fv.na{color:#B9C4D6}
.fstep .fr{font-size:11px;color:var(--green);font-weight:600;margin-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:13px}
.mc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.mc .l{font-size:11px;color:var(--muted)}
.mc .v{font-size:20px;font-weight:800;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
.mc .v.na{color:#C3CDDD}

/* ===== tables ===== */
.aptbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.aptbl th{background:var(--pc2);color:#fff;font-weight:500;padding:8px 10px;text-align:right;font-size:12px}
.aptbl th:first-child{text-align:left;border-radius:8px 0 0 0}.aptbl th:last-child{border-radius:0 8px 0 0}
.aptbl th.l{text-align:left}
.aptbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.aptbl td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.aptbl td.l{text-align:left;color:#4A5563;font-weight:500}
.aptbl td.na{color:#C3CDDD}
.aptbl tr:nth-child(even){background:#F7F9FD}
.subhead2{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 2px}

/* ===== action plan ===== */
.apoint{display:flex;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line)}
.apoint:last-child{border-bottom:none}
.apoint .num{flex-shrink:0;width:33px;height:33px;border-radius:10px;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.apoint .body .t{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.4}
.apoint .body .f{font-size:13px;color:#4A5563;margin-top:5px;line-height:1.55}
.apoint .body .act{font-size:13px;margin-top:8px;background:#EAF3EC;border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:7px 12px;color:#2C5738;line-height:1.5}
.apoint .body .act b{color:#1F5F35;font-weight:700}
.callout{background:#EAF3EC;border:1px solid #BFE0C8;border-left:4px solid var(--green);border-radius:12px;padding:14px 17px;font-size:13.5px;color:#2C5738;margin-top:14px}
.callout b{color:#1F5F35}

/* ===== alert box ===== */
.alertbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:#FDECEC;border:1px solid #F3C3C3;border-left:4px solid var(--red);border-radius:14px;padding:15px 18px;margin-top:16px}
.alertbox .ab-badge{font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--red);border-radius:20px;padding:4px 10px;white-space:nowrap}
.alertbox .ab-body b{font-size:14.5px;color:#8E2B2B}
.alertbox .ab-body p{margin:4px 0 0;font-size:13px;color:#7A3B3B;line-height:1.6}
.alertbox.info{background:#FFF7E8;border-color:#F0DCB0;border-left-color:#C98A12}.alertbox.info .ab-badge{background:#C98A12}.alertbox.info .ab-body b{color:#8A5E07}.alertbox.info .ab-body p{color:#6E552A}

.refrow{display:flex;gap:10px;align-items:flex-start;background:#F4F7FC;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:12.5px;color:#4A5563;margin-bottom:8px}
.refrow i{width:16px;height:16px;color:var(--accent);flex-shrink:0;margin-top:2px}
/* ===== overview ===== */
.ovcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ovc{border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:#fff;position:relative;overflow:hidden}
.ovc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.ovc.wait{background:#FBFCFF}
.ovc .oh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ovc .on{font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap}
.ovc .st{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.st.ok{background:#E4F4EA;color:var(--green)}
.st.wt{background:#FBF0DA;color:#A5741A}
.ovc .obig{font-size:31px;font-weight:800;color:var(--c);margin-top:10px;line-height:1;font-variant-numeric:tabular-nums}
.ovc .obig.na{color:#C3CDDD;font-size:28px}
.ovc .ol{font-size:11.5px;color:var(--muted)}
.ovc .orow{display:grid;grid-template-columns:1fr;gap:7px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.ovc .orow div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ovc .orow div .l{font-size:11px;color:var(--muted);white-space:nowrap}
.ovc .orow div .v{font-size:14px;white-space:nowrap;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.ovc .orow div .v.na{color:#C3CDDD}
.blend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.bc{background:#F4F7FC;border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-align:center}
.bc .l{font-size:11.5px;color:var(--muted)}
.bc .v{font-size:24px;font-weight:800;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums}
.bc.good .v{color:var(--green)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px;margin-top:6px}
.stp{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:#FAFBFE}
.stp .sn{font-size:13.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.stp .sn i{width:16px;height:16px;color:var(--accent)}
.stp ul{margin:9px 0 0 17px;font-size:12.5px;color:#4A5563;line-height:1.75}
.hs .ksub{font-size:11px;opacity:.75;margin-top:2px;font-weight:500}
.foot{max-width:1040px;margin:16px auto 0;font-size:11px;color:var(--muted);padding:0 6px;line-height:1.6}
@media(max-width:760px){.herostats,.wtabs,.wgrid,.mgrid,.ovcards,.blend,.steps,.cumstat{grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(2,1fr)}.fstep{border-radius:0!important;border-left:1px solid var(--line)!important}.hero h1{font-size:21px}.pbar .pn{width:100px}}
</style>
</head>
<body>
<div id="tt"></div>
<div class="wrap">

  <div class="mast">
    <div class="t"><i data-lucide="layout-dashboard"></i> Ads Monthly Summary · รายงานสรุปการยิงแอดรายเดือน</div>
    <div class="m" id="mastMonth"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="pane on" id="pane-overview"></div>
  <div class="pane" id="pane-shopee"></div>
  <div class="pane" id="pane-tiktok"></div>
  <div class="pane" id="pane-wpc"></div>
  <div class="pane" id="pane-igatelier"></div>
  <div class="pane" id="pane-igluck"></div>

const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const NA='—';
const AMBER='#E8A13A',MUT='#6B7688',GRID='#E7EDF5',GREEN='#2E9E5B',RED='#DB4A4A';
const tt=document.getElementById('tt');
function bindTips(el){
  if(!el)return;
  el.addEventListener('mouseover',e=>{const t=e.target.getAttribute&&e.target.getAttribute('data-tip');if(t){tt.textContent=t;tt.style.opacity='1';}});
  el.addEventListener('mousemove',e=>{if(tt.style.opacity==='1'){let x=e.clientX+14,y=e.clientY+14;if(x>window.innerWidth-200)x=e.clientX-tt.offsetWidth-14;tt.style.left=x+'px';tt.style.top=y+'px';}});
  el.addEventListener('mouseout',e=>{if(e.target.getAttribute&&e.target.getAttribute('data-tip'))tt.style.opacity='0';});
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- empty state ---------- */
function empty(title,desc,chips){
  return `<div class="empty"><div class="ei"><i data-lucide="database"></i></div>
    <div class="et">${title}</div><div class="ed">${desc}</div>
    ${chips&&chips.length?`<div class="chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}</div>`;
}

/* ---------- generic combo chart (bars + line) ---------- */
function comboChart(o){
  const W=940,H=o.H||290,pL=58,pR=60,pT=o.pT||22,pB=32;
  const n=o.bars.length,pw=W-pL-pR,ph=H-pT-pB,base=pT+ph,slot=pw/n,bw=slot*(o.bw||0.56);
  const sMax=o.barMax,rMax=o.lineMax;let g='';
  const ticks=o.ticks||5;
  for(let i=0;i<=ticks;i++){const y=pT+ph*i/ticks;
    g+=`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${pL+pw}" y2="${y.toFixed(1)}" stroke="${GRID}"/>`;
    g+=`<text x="${pL-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="${MUT}">${o.fmtL?o.fmtL(sMax*(1-i/ticks)):fmt(sMax*(1-i/ticks)/1000)+'k'}</text>`;
    g+=`<text x="${pL+pw+7}" y="${(y+4).toFixed(1)}" text-anchor="start" font-size="10" fill="${MUT}">${o.fmtR?o.fmtR(rMax*(1-i/ticks)):fmt(rMax*(1-i/ticks))}</text>`;}
  let rects='',pts=[],dots='',labels='';
  for(let i=0;i<n;i++){const cx=pL+slot*(i+0.5);const v=o.bars[i];
    if(v>0){const h=Math.max(0,v/sMax*ph);
      rects+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(base-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${o.rx||2}" fill="${o.barColor}" data-tip="${esc(o.barTip(i,v))}" style="cursor:pointer"/>`;
      if(o.barLabel)rects+=`<text x="${cx.toFixed(1)}" y="${(base-h/2+4).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">${fmt(v)}</text>`;}
    const lv=o.line[i];
    if(lv>0||o.lineZero){const y=base-lv/rMax*ph;pts.push(`${cx.toFixed(1)},${y.toFixed(1)}`);
      dots+=`<circle cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" r="${o.dotR||2.5}" fill="#fff" stroke="${AMBER}" stroke-width="2"/><circle cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="transparent" data-tip="${esc(o.lineTip(i,lv))}" style="cursor:pointer"/>`;
      if(o.lineLabel)dots+=`<text x="${cx.toFixed(1)}" y="${Math.max(y-18,pT+2).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#B4791C" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">${o.lineLabel(lv)}</text>`;}
    if(o.xlabel){const t=o.xlabel(i);if(t!==null)labels+=`<text x="${cx.toFixed(1)}" y="${base+18}" text-anchor="middle" font-size="${o.xsize||9}" font-weight="${o.xbold&&o.xbold(i)?'700':'500'}" fill="${o.xbold&&o.xbold(i)?'#1F3864':MUT}">${t}</text>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}<polyline points="${pts.join(' ')}" fill="none" stroke="${AMBER}" stroke-width="2.3"/>${rects}${dots}${labels}</svg>`;
}

/* ---------- day labels: platforms may carry days past the month end ---------- */
function DN(d,i){ return d.dayNames ? d.dayNames[i] : (i+1)+' '+MONTH.dayLabel; }
function DT(d,i){ return d.dayTicks ? d.dayTicks[i] : ((i+1)%2===1?i+1:null); }

/* ---------- build one platform pane ---------- */
const state={};
function buildPane(key){
  const d=P[key],el=document.getElementById('pane-'+key);
  el.style.setProperty('--pc',d.color);el.style.setProperty('--pc2',d.color2);
  const K=d.kpi,L=d.kpiLabels,TR=d.mode==='traffic';
  const kv=(v,dec)=>v===null||v===undefined?`<div class="v na">${NA}</div>`:`<div class="v">${fmt(v,dec||0)}</div>`;

  let h=`<div class="hero">
    <div class="ey"><i data-lucide="${d.icon}"></i> ${d.full} · รายงานสรุปแคมเปญ</div>
    <h1>${d.name} — Ads Monthly Summary · ${MONTH.label.split('(')[1]?MONTH.label.split('(')[1].replace(')',''):MONTH.label}</h1>
    <div class="desc">ช่วงข้อมูล: ${d.period} · ที่มา: ${d.source}</div>
    <div class="herostats">
      ${[0,1,2,3,4].map(i=>{
        const dec=[2,0,2,0,0][i], raw=d.kpiText?d.kpiText[i]:[K.roas,K.adSales,K.adCost,K.adOrders,K.gross][i];
        const body=(raw===null||raw===undefined)?`<div class="v na">${NA}</div>`:`<div class="v">${d.kpiText?raw:fmt(raw,dec)}</div>`;
        const sub=d.kpiSub&&d.kpiSub[i]?`<div class="ksub">${d.kpiSub[i]}</div>`:'';
        return `<div class="hs ${i===0?'roas':''}"><div class="l">${L[i]}</div>${body}${sub}</div>`;}).join('')}
    </div></div>`;

  if(d.notRunning){
    h+=`<div class="banner" style="background:#F1F4FA;border-color:#D5E0F0;border-left-color:#8FAADC;color:#3D5680"><i data-lucide="hourglass" style="color:#4472C4"></i><div>${d.notRunNote}</div></div>`;
    h+=`<div class="foot" style="margin-top:14px">${d.foot} · ที่มา: ${d.source}</div>`;
    el.innerHTML=h; return;
  }

  if(!d.ready){
    h+=`<div class="banner"><i data-lucide="hourglass"></i><div><b>แท็บนี้เป็นโครงรอข้อมูล</b> — โครงสร้างรายงานพร้อมแล้วทุกส่วน เหลือแค่เติมตัวเลข<br>
      เปิดไฟล์นี้ด้วย text editor → หาบล็อก <code>P.${key}</code> ที่บนสุดของ <code>&lt;script&gt;</code> → เปลี่ยน <code>ready:false</code> เป็น <code>ready:true</code> แล้วใส่ตัวเลขตามช่องที่เตรียมไว้<br>
      <span style="display:inline-block;margin-top:6px">📥 <b>ดึงข้อมูลจาก:</b> ${d.needHow}</span></div></div>`;
  }

  if(d.alert){
    h+=`<div class="alertbox ${d.alert.info?'info':''}"><div class="ab-badge">${d.alert.info?'สิ่งที่เปลี่ยนในเดือนนี้':'ต้องรู้ก่อนอ่าน'}</div><div class="ab-body"><b>${d.alert.t}</b><p>${d.alert.f}</p></div></div>`;
  }

  /* --- period table (ตารางสรุปช่วง แทนการ์ดรายสัปดาห์) --- */
  if(d.periodTable){ const PT=d.periodTable;
    h+=`<section><div class="sh"><i data-lucide="calendar-range"></i> ${PT.label}</div>

      ${PT.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'l':''}">${c}</td>`).join('')}</tr>`).join('')}

      ${PT.note?`<div class="callout">${PT.note}</div>`:''}</section>`; }

  /* --- weekly --- */

    <div class="sub">${d.ready?(TR?'กดที่การ์ดสัปดาห์เพื่อดูรายละเอียด · แท่ง = คลิกเข้าเว็บ · เส้น = ต้นทุนต่อคลิก':'กดที่การ์ดสัปดาห์เพื่อดูรายละเอียด · แท่ง = ยอดขายจากแอด · เส้น = ROAS'):'สรุปผลรายสัปดาห์ ช่วยให้เห็นเทรนด์ชัดกว่ารายวันที่เหวี่ยงแรง'}</div>
    <div id="${key}-wtabs"></div><div id="${key}-wpanel"></div><div id="${key}-wchart" style="margin-top:8px"></div>
    ${d.weeks&&d.weeks.length>1?`<div class="legend"><span><i style="background:${d.color}"></i>${TR?'คลิกเข้าเว็บ':'ยอดขายจากแอด'}</span><span><i class="ln" style="background:${AMBER}"></i>${TR?'ต้นทุนต่อคลิก':'ROAS'}</span></div>`:''}

    <div id="${key}-c1"></div>${d.dailySales?`<div class="legend"><span><i style="background:${d.color}"></i>${TR?'คลิก/วัน':'ยอดขาย/วัน'}</span><span><i class="ln" style="background:${AMBER}"></i>ค่าโฆษณา/วัน</span></div>`:''}

  </section>`;

  /* --- funnel --- */
  if(d.funnel){
    const F=d.funnel;const first=F.steps[0].v;

  /* ---- items bars ---- */
  if(d.items && !d.noItems){
    document.querySelectorAll(`#${key}-tg button`).forEach(b=>b.onclick=()=>{state[key].metric=b.getAttribute('data-m');renderBars(key);});

function renderWeek(key){
  const d=P[key],wt=document.getElementById(key+'-wtabs'),wp=document.getElementById(key+'-wpanel'),wc=document.getElementById(key+'-wchart');
  if(!d.weeks){
    wt.className='';wt.innerHTML=empty('รอข้อมูลรายสัปดาห์','ใส่สรุป 4 สัปดาห์ (ยอดขายจากแอด · ค่าแอด · ROAS · ออเดอร์) แล้วการ์ดสัปดาห์แบบกดได้ + กราฟเปรียบเทียบจะขึ้นให้เอง',['n','range','sales','cost','roas','orders']);
    wp.innerHTML='';wc.innerHTML='';return;
  }
  const TR=d.mode==='traffic';
  wt.className='wtabs';
  const sel=state[key].week;
  wt.innerHTML=d.weeks.map((w,i)=>`<div class="wt ${i===sel?'on':''}" data-i="${i}">${w.best?'<span class="crown">ดีสุด</span>':''}<div class="wn">${w.n}</div><div class="wr">${w.range}</div><div class="wv">${TR?fmt(w.clicks):fmt(w.roas,2)}</div><div class="wl">${TR?'คลิกเข้าเว็บ':'ROAS'}</div></div>`).join('');
  const w=d.weeks[sel];
  wp.className='wpanel';
  wp.innerHTML=TR
   ?`<b>${w.n} (${w.range} · ${w.days} วัน)</b> — พาคนเข้าเว็บได้ <b>${fmt(w.clicks)} ครั้ง</b> จากค่าโฆษณา ${fmt(w.cost,2)} บาท คิดเป็น <b>฿${fmt(w.cpc,2)} ต่อคลิก</b> · เฉลี่ย ${fmt(w.clicks/w.days,1)} ครั้ง/วัน${w.best?' · เป็นสัปดาห์ที่ทำผลงานดีที่สุด':''}
    <div class="wgrid">
      <div class="wg"><div class="l">คลิกเข้าเว็บ</div><div class="v">${fmt(w.clicks)}</div></div>
      <div class="wg"><div class="l">ค่าโฆษณา</div><div class="v">${fmt(w.cost,2)}</div></div>
      <div class="wg"><div class="l">ต้นทุนต่อคลิก</div><div class="v" style="color:${w.cpc<=3?GREEN:'#B4791C'}">฿${fmt(w.cpc,2)}</div></div>
      <div class="wg"><div class="l">CTR</div><div class="v" style="color:${w.ctr>=4?GREEN:'#B4791C'}">${fmt(w.ctr,2)}%</div></div></div>`
   :`<b>${w.n} (${w.range})</b> — ยอดขายจากแอด <b>${fmt(w.sales)} บาท</b> จากค่าแอด ${fmt(w.cost,0)} บาท ทำ ROAS <b>${fmt(w.roas,2)}</b> ได้ ${w.orders} ออเดอร์${w.best?' · เป็นสัปดาห์ที่ทำผลงานดีที่สุดของเดือน':''}
    <div class="wgrid">
      <div class="wg"><div class="l">ยอดขายจากแอด</div><div class="v">${fmt(w.sales)}</div></div>
      <div class="wg"><div class="l">ค่าแอด</div><div class="v">${fmt(w.cost,0)}</div></div>
      <div class="wg"><div class="l">ROAS</div><div class="v" style="color:${w.roas>=8?GREEN:'#B4791C'}">${fmt(w.roas,2)}</div></div>
      <div class="wg"><div class="l">ออเดอร์</div><div class="v">${w.orders}</div></div></div>`;
  const bars=TR?d.weeks.map(x=>x.clicks):d.weeks.map(x=>x.sales);
  const line=TR?d.weeks.map(x=>x.cpc):d.weeks.map(x=>x.roas);
  const smax=TR?Math.ceil(Math.max(...bars)*1.2/100)*100:Math.ceil(Math.max(...bars)*1.15/5000)*5000;
  const rmax=Math.ceil(Math.max(...line)*1.15);
  if(d.weeks.length<2){ wc.innerHTML=''; wt.querySelectorAll('.wt').forEach(e=>e.onclick=null); return; }
  wc.innerHTML=comboChart({H:258,pT:46,bw:TR?0.3:0.42,rx:4,dotR:5,bars:bars,line:line,
    barMax:smax,lineMax:rmax,barColor:d.color,barLabel:true,lineLabel:v=>TR?'฿'+fmt(v,2):'ROAS '+fmt(v,2),ticks:4,
    fmtL:TR?(v=>fmt(v)):null,fmtR:TR?(v=>fmt(v,2)):null,
    barTip:(i,v)=>TR?`${d.weeks[i].n} · คลิก ${fmt(v)} ครั้ง · CTR ${fmt(d.weeks[i].ctr,2)}%`:`${d.weeks[i].n} · ยอดขายจากแอด ${fmt(v)} บาท · ${d.weeks[i].orders} ออเดอร์`,
    lineTip:(i,v)=>TR?`${d.weeks[i].n} · ต้นทุนต่อคลิก ฿${fmt(v,2)}`:`${d.weeks[i].n} · ROAS ${fmt(v,2)}`,
    xlabel:i=>d.weeks[i].n,xsize:12,xbold:i=>i===sel});
  bindTips(wc);
  wt.querySelectorAll('.wt').forEach(e=>e.onclick=()=>{state[key].week=+e.getAttribute('data-i');renderWeek(key);paintIcons();});
}

function renderBars(key){
  const d=P[key],m=state[key].metric,TR=d.mode==='traffic';
  const arr=[...d.items].sort((a,b)=>b[m]-a[m]);
  const max=Math.max(...arr.map(p=>p[m]));
  const unit=TR?(m==='ctr'?'%':(m==='imp'?' ครั้ง':' ฿')):(m==='roas'?'':(m==='orders'?' ออเดอร์':' บาท'));
  const col=r=>r>=8?GREEN:r>=4?AMBER:RED;
  document.getElementById(key+'-bars').innerHTML=arr.map(p=>{
    const val=TR?(m==='ctr'?fmt(p[m],2):fmt(p[m],m==='cost'?2:0)):(m==='roas'?fmt(p[m],2):fmt(p[m]));
    const c=TR?(m==='ctr'?(p.ctr>=8?GREEN:p.ctr>=3.9?AMBER:d.color):d.color):(m==='roas'?col(p.roas):d.color);
    const wpct=Math.max(6,p[m]/max*100);
    return `<div class="pbar"><div class="pn">${esc(p.name)}</div><div class="track"><div class="fill" style="width:${wpct}%;background:${c}">${val}${unit}</div></div></div>`;}).join('');
  document.querySelectorAll(`#${key}-tg button`).forEach(b=>b.classList.toggle('on',b.getAttribute('data-m')===m));
}

/* ---------- overview pane ---------- */
function buildOverview(){
  const keys=KEYS;
  const ready=keys.filter(k=>P[k].ready);
  const rev=ready.filter(k=>!P[k].noRevenue);
  const traf=ready.filter(k=>P[k].noRevenue);
  const tCost=rev.reduce((s,k)=>s+P[k].kpi.adCost,0);
  const tSales=rev.reduce((s,k)=>s+P[k].kpi.adSales,0);
  const tOrd=rev.reduce((s,k)=>s+P[k].kpi.adOrders,0);
  const tTrafCost=traf.reduce((s,k)=>s+P[k].kpi.adCost,0);
  const tTrafClicks=traf.reduce((s,k)=>s+P[k].kpi.adOrders,0);
  const blend=tCost?tSales/tCost:0;
  const el=document.getElementById('pane-overview');
  el.style.setProperty('--pc','#2E5496');el.style.setProperty('--pc2','#1F3864');

  let h=`<div class="hero">
    <div class="ey"><i data-lucide="layers-3"></i> ภาพรวมทุกแพลตฟอร์ม · ${MONTH.label}</div>
    <h1>Ads Monthly Summary — All Platforms</h1>
